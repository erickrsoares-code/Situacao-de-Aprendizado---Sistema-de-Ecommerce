<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>TechMark - Supermercado</title>
  <style>
    /* CSS ORIGINAL PRESERVADO E ADAPTADO */
    :root {
      --primary: #1d4ed8; --primary-hover: #1e40af; --green: #16a34a;
      --bg-main: #f8fafc; --text-dark: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-dark); min-height: 100vh; }
    
    .site-header { background: #ffffff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo-brand { font-size: 24px; font-weight: 800; color: var(--primary); text-decoration: none; }
    .header-actions { display: flex; gap: 12px; }
    .btn-cart-nav { background: #0f172a; color: white; border: none; padding: 10px 18px; border-radius: 99px; font-weight: 700; text-decoration: none; }
    .btn-auth-logout { color: #ef4444; border: 1.5px solid #fca5a5; padding: 8px 16px; border-radius: 99px; font-weight: 700; text-decoration: none; }
    
    .main-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    .flash-msgs { background: #eff6ff; color: var(--primary); padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold; }
    .flash-error { background: #fef2f2; color: #ef4444; }
  </style>
</head>
<body>
  {% if session.get('usuario') %}
  <header class="site-header">
    <a href="{{ url_for('menu') }}" class="logo-brand">🛒 TechMark</a>
    <div class="header-actions">
      <a href="{{ url_for('carrinho') }}" class="btn-cart-nav">🛒 Ir para o Carrinho</a>
      <a href="{{ url_for('logout') }}" class="btn-auth-logout">Sair</a>
    </div>
  </header>
  {% endif %}

  <main class="main-container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash-msgs {% if 'incorreto' in message %}flash-error{% endif %}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    {% block content %}{% endblock %}
  </main>
</body>
</html>
